<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Farnos! 🎉</title>

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Initialize map view centered globally
    const map = L.map('map').setView([20.5937, 78.9629], 3);

    // OpenStreetMap Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Load locations from markers.geojson
    fetch('./markers.geojson?v=2')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: (feature, layer) => {
            const props = feature.properties;
            
            // Redirect to card.html with parameters on marker tap/click
            layer.on('click', () => {
              const url = `card.html?title=${encodeURIComponent(props.title)}&subtitle=${encodeURIComponent(props.subtitle)}&memory=${encodeURIComponent(props.memory)}`;
              window.location.href = url;
            });
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
